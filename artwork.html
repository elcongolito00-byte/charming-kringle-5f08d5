<style>
body {
  margin: 0;
  font-family: "Rubik Iso", system-ui;
  background: #f5f5f2;
  color: #111;
  transition: 0.4s;
}

/* texture */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  background: url("https://www.transparenttextures.com/patterns/paper-fibers.png");
  opacity: 0.2;
  pointer-events: none;
}



/* side nav */
.side-nav {
  position: fixed;
  top: 0;
  left: 0;
  bottom: 0;
  width: 220px;
  padding: 40px 18px;
  background: rgba(255,255,255,0.95);
  border-right: 1px solid rgba(0,0,0,0.12);
  backdrop-filter: blur(14px);
  z-index: 20;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

body.light .side-nav {
  background: rgba(245,245,242,0.95);
}

body.dark .side-nav {
  background: rgba(11,11,11,0.92);
  border-color: rgba(255,255,255,0.16);
}

.side-nav .nav-title {
  font-size: 12px;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  opacity: 0.65;
  margin-bottom: 10px;
}

.side-nav a {
  display: inline-flex;
  align-items: center;
  justify-content: flex-start;
  padding: 10px 14px;
  border: 1px solid currentColor;
  border-radius: 8px;
  text-decoration: none;
  color: inherit;
  font-size: 15px;
  transition: transform 0.2s ease, background 0.2s ease, opacity 0.2s ease;
}

.side-nav a:hover {
  background: rgba(0,0,0,0.04);
  transform: translateX(4px);
  opacity: 0.9;
}



body {
  padding-left: 240px;
}

.back {
  left: 240px !important;
}

@media (max-width: 768px) {
  .side-nav {
    width: 100%;
    height: auto;
    bottom: auto;
    flex-direction: row;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
    padding: 12px 12px;
    border-right: none;
    border-bottom: 1px solid rgba(0,0,0,0.08);
  }
  .side-nav .nav-title {
    display: none;
  }
  body {
    padding-left: 0;
    padding-top: 120px;
  }
  .container {
    padding-top: 40px;
  }
  .back {
    left: 20px;
  }
}

.container {
  max-width: 800px;
  margin: auto;
  padding: 120px 20px;
  text-align: center;
}

.title {
  font-size: 36px;
  margin-bottom: 60px;
}

.artwork {
  width: 100%;
  max-width: 500px;
  margin: 0 auto 60px;
  background: #e0e0e0;
  aspect-ratio: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 1px solid #111;
}

.artwork-placeholder {
  font-size: 18px;
  color: #888;
  text-align: center;
  padding: 20px;
}

.desc {
  font-size: 18px;
  line-height: 1.6;
  margin-bottom: 20px;
  opacity: 0.8;
}

@media (max-width: 768px) {
  .container {
    padding: 80px 20px;
  }
  
  .title {
    font-size: 28px;
    margin-bottom: 40px;
  }
  
  .desc {
    font-size: 16px;
  }
}

/* back button */
.back {
  position: fixed;
  top: 20px;
  left: 20px;
  cursor: pointer;
  border: 1px solid #111;
  padding: 6px 10px;
}
</style>
