<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Mixtape</title>

<link href="https://fonts.googleapis.com/css2?family=Rubik+Iso&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  font-family: "Rubik Iso", system-ui;
  transition: background 0.4s, color 0.4s;
}

/* 🤍 LIGHT MODE */
body.light {
  background: #f5f5f2;
  color: #111;
}

/* 🌑 DARK MODE */
body.dark {
  background: #0b0b0b;
  color: #eee;
}

/* 🖋️ texture */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  background: url("https://www.transparenttextures.com/patterns/paper-fibers.png");
  opacity: 0.2;
  pointer-events: none;
}

/* toggle button */
.toggle {
  position: fixed;
  top: 20px;
  right: 20px;
  cursor: pointer;
  font-size: 14px;
  padding: 8px 12px;
  border: 1px solid currentColor;
}

/* layout */


/* side nav */
.side-nav {
  position: fixed;
  top: 0;
  left: 0;
  bottom: 0;
  width: 220px;
  padding: 40px 18px;
  background: rgba(255,255,255,0.95);
  border-right: 1px solid rgba(0,0,0,0.12);
  backdrop-filter: blur(14px);
  z-index: 20;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

body.light .side-nav {
  background: rgba(245,245,242,0.95);
}

body.dark .side-nav {
  background: rgba(11,11,11,0.92);
  border-color: rgba(255,255,255,0.16);
}

.side-nav .nav-title {
  font-size: 12px;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  opacity: 0.65;
  margin-bottom: 10px;
}

.side-nav a {
  display: inline-flex;
  align-items: center;
  justify-content: flex-start;
  padding: 10px 14px;
  border: 1px solid currentColor;
  border-radius: 8px;
  text-decoration: none;
  color: inherit;
  font-size: 15px;
  transition: transform 0.2s ease, background 0.2s ease, opacity 0.2s ease;
}

.side-nav a:hover {
  background: rgba(0,0,0,0.04);
  transform: translateX(4px);
  opacity: 0.9;
}



body {
  padding-left: 240px;
}

.back {
  left: 240px !important;
}

@media (max-width: 768px) {
  .side-nav {
    width: 100%;
    height: auto;
    bottom: auto;
    flex-direction: row;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
    padding: 12px 12px;
    border-right: none;
    border-bottom: 1px solid rgba(0,0,0,0.08);
  }
  .side-nav .nav-title {
    display: none;
  }
  body {
    padding-left: 0;
    padding-top: 120px;
  }
  .container {
    padding-top: 40px;
  }
  .back {
    left: 20px;
  }
}

.container {
  max-width: 900px;
  margin: auto;
  padding: 140px 20px;
}

.track {
  opacity: 0;
  transform: translateY(60px);
  filter: blur(6px);
  transition: all 0.8s ease;
  font-size: 28px;
  margin: 120px 0;
  cursor: pointer;
  width: fit-content;
  letter-spacing: 2px;
}

.track.left { margin-right: auto; }
.track.right { margin-left: auto; }

.track.show {
  opacity: 0.8;
  transform: translateY(0) translateX(var(--drift));
  filter: blur(0);
}

.track:hover {
  opacity: 1;
  transform: translateY(-10px);
}

@media (max-width: 768px) {
  .container {
    padding: 100px 20px;
  }
  
  .track {
    font-size: 20px;
    margin: 80px 0;
    letter-spacing: 1px;
  }
  
  .toggle {
    font-size: 12px;
    padding: 6px 10px;
  }
}
</style>

<link rel="stylesheet" href="mobile.css">

</head>

<body class="light">

<div class="side-nav">
  <div class="nav-title">menu</div>
  <a href='/'>home</a>
  <a href='/tracklist'>tracklist</a>
  <a href='/artwork'>artwork</a>
  <a href='/socials'>socials</a>
</div>


<div class="toggle" onclick="toggleMode()">toggle</div>

<div class="container">

  <div class="track left" onclick="goToTrack(1)">1. chulo ft cashyy</div>
  <div class="track right" onclick="goToTrack(2)">2. put it on</div>
  <div class="track left" onclick="goToTrack(3)">3. bass</div>
  <div class="track right" onclick="goToTrack(4)">4. away</div>
  <div class="track left" onclick="goToTrack(5)">5. cruise</div>
  <div class="track right" onclick="goToTrack(6)">6. hot_specimen</div>
  <div class="track left" onclick="goToTrack(7)">7. ppwp</div>
  <div class="track right" onclick="goToTrack(8)">8. escandalosa</div>
  <div class="track left" onclick="goToTrack(9)">9. only u</div>
  <div class="track right" onclick="goToTrack(10)">10. play pretend ft Joy</div>
  <div class="track left" onclick="goToTrack(11)">11. stay back</div>
  <div class="track right" onclick="goToTrack(12)">12. the only one</div>
  <div class="track left" onclick="goToTrack(13)">13. time walks</div>
  <div class="track right" onclick="goToTrack(14)">14. take care of your soul</div>
  <div class="track left" onclick="goToTrack(15)">15. i'll remember you</div>
  <div class="track right" onclick="goToTrack(16)">16. peace</div>

</div>

<script>
const tracks = document.querySelectorAll('.track');

function reveal() {
  const trigger = window.innerHeight * 0.85;

  tracks.forEach(track => {
    const rect = track.getBoundingClientRect();

    if (rect.top < trigger && rect.bottom > 0) {
      if (!track.classList.contains("show")) {
        const drift = (Math.random() * 80 - 40) + "px";
        track.style.setProperty('--drift', drift);
      }
      track.classList.add("show");
    }
  });
}

window.addEventListener("scroll", reveal);
reveal();

/* 🌗 toggle */
function toggleMode() {
  document.body.classList.toggle("dark");
  document.body.classList.toggle("light");
}

/* 🔗 go to track pages */
function goToTrack(num) {
  window.location.href = `track${num}.html`;
}

</script>

</body>
</html>
